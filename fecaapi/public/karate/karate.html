<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FECAAPP - KARATÉ ELITE COMMAND v5.2 PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="script.js" defer></script>
    <style>
        :root {
            --primary: #FF0044; --primary-glow: rgba(255,0,68,0.12);
            --secondary: #FFFFFF; --gold: #FFD700;
            --bg: #050505; --bg2: #0D0D0D; --bg3: #111111;
            --border: rgba(255,255,255,0.07);
            --text: #FFFFFF; --text-dim: rgba(255,255,255,0.4);
            --green: #00FF85; --red: #FF0044; --blue: #00D1FF;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; }
        .admin-lock { background:#000; border-bottom:2px solid var(--primary); padding:10px 20px; display:flex; justify-content:center; align-items:center; gap:15px; font-family:'Orbitron',sans-serif; font-size:11px; flex-wrap:wrap; }
        .admin-lock input { background:#111; border:1px solid #333; color:var(--primary); padding:5px 10px; border-radius:4px; outline:none; }
        .admin-lock button { background:var(--primary); color:#fff; border:none; padding:5px 15px; border-radius:4px; font-weight:bold; cursor:pointer; text-transform:uppercase; font-family:'Orbitron',sans-serif; }
        .header { background:linear-gradient(135deg,#0a0a0a,#111); border-bottom:1px solid var(--border); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
        .logo-area { display:flex; align-items:center; gap:15px; }
        .sport-badge { background:var(--primary); color:#fff; padding:4px 10px; border-radius:4px; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; }
        .header h1 { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:900; color:var(--primary); letter-spacing:2px; }
        #status-io { font-family:'Orbitron',sans-serif; font-size:10px; color:var(--text-dim); }
        .main-layout { display:flex; min-height:calc(100vh - 100px); }
        .side-panel { width:300px; min-width:300px; background:var(--bg2); border-right:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:15px; overflow-y:auto; }
        .panel-card { background:var(--bg3); border-radius:10px; padding:15px; border:1px solid var(--border); }
        .panel-card h3 { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; margin-bottom:12px; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
        .panel-card label { display:block; font-size:10px; color:var(--text-dim); margin-bottom:4px; margin-top:8px; text-transform:uppercase; letter-spacing:1px; }
        .panel-card input, .panel-card select { width:100%; background:#1a1a1a; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-size:12px; outline:none; }
        .btn { width:100%; padding:9px; border-radius:6px; border:none; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; margin-top:12px; text-transform:uppercase; transition:opacity 0.15s; }
        .btn:hover { opacity:0.85; }
        .btn-red   { background:var(--primary); color:#fff; }
        .btn-gold  { background:var(--gold); color:#000; }
        .btn-green { background:var(--green); color:#000; }
        .btn-blue  { background:var(--blue); color:#000; }
        .red-border   { border-color:var(--primary) !important; }
        .gold-border  { border-color:var(--gold) !important; }
        .green-border { border-color:var(--green) !important; }
        .blue-border  { border-color:var(--blue) !important; }
        .regie-area { flex:1; padding:25px; overflow-y:auto; background:var(--bg); }
        .regie-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:15px; color:var(--text-dim); }
        .regie-empty .icon-big { font-size:60px; opacity:0.3; }
        .regie-empty p { font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px; }
        .tatami-header { background:linear-gradient(135deg,rgba(255,0,68,0.08),transparent); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px; }
        .tatami-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .comp-title { font-family:'Orbitron',sans-serif; font-size:13px; color:var(--primary); font-weight:900; }
        .fighters-row { display:grid; grid-template-columns:1fr 120px 1fr; align-items:center; gap:10px; }
        .fighter-card { text-align:center; }
        .fighter-photo { width:80px; height:80px; border-radius:50%; margin:0 auto 10px; background:var(--bg2); border:3px solid var(--primary); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden; }
        .fighter-photo img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
        .fighter-photo.blue-side { border-color:var(--blue); }
        .fighter-name { font-size:14px; font-weight:900; color:var(--text); }
        .fighter-country { font-size:10px; color:var(--text-dim); margin-top:2px; }
        .fighter-club { font-size:9px; color:var(--text-dim); }
        .score-center { text-align:center; }
        .score-display { display:flex; align-items:center; justify-content:center; gap:8px; }
        .score-val { font-family:'Orbitron',sans-serif; font-size:52px; font-weight:900; }
        .score-aka { color:var(--primary); }
        .score-ao  { color:var(--blue); }
        .score-sep { color:var(--text-dim); font-size:30px; }
        .timer-box { margin-top:8px; display:inline-flex; align-items:center; gap:6px; padding:6px 14px; background:var(--bg2); border-radius:6px; border:1px solid var(--border); }
        .timer-val { font-family:'Orbitron',sans-serif; font-size:18px; font-weight:900; color:var(--gold); }
        .round-badge { font-family:'Orbitron',sans-serif; font-size:9px; color:var(--text-dim); margin-top:4px; }
        .penalties-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
        .penalty-card { background:var(--bg2); border-radius:8px; padding:10px; border:1px solid var(--border); }
        .penalty-label { font-size:8px; color:var(--text-dim); font-family:'Orbitron',sans-serif; letter-spacing:1px; margin-bottom:6px; }
        .penalty-dots { display:flex; gap:5px; }
        .penalty-dot { width:12px; height:12px; border-radius:50%; background:var(--bg3); border:1px solid var(--border); }
        .penalty-dot.active-chukoku { background:#FFD700; border-color:#FFD700; }
        .penalty-dot.active-keikoku { background:#FF8800; border-color:#FF8800; }
        .penalty-dot.active-hansoku { background:var(--primary); border-color:var(--primary); }
        .score-actions-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
        .action-btn { padding:10px; border-radius:7px; border:none; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px; transition:all 0.15s; }
        .action-aka { background:rgba(255,0,68,0.1); color:var(--primary); border:1px solid var(--primary); }
        .action-aka:hover { background:var(--primary); color:#fff; }
        .action-ao  { background:rgba(0,209,255,0.1); color:var(--blue); border:1px solid var(--blue); }
        .action-ao:hover  { background:var(--blue); color:#000; }
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
        .stat-box { background:var(--bg2); border-radius:8px; padding:12px; text-align:center; border:1px solid var(--border); }
        .stat-val { font-family:'Orbitron',sans-serif; font-size:18px; font-weight:900; color:var(--primary); }
        .stat-lbl { font-size:8px; color:var(--text-dim); margin-top:3px; text-transform:uppercase; letter-spacing:1px; }
        .events-log { margin-top:16px; max-height:220px; overflow-y:auto; }
        .event-item { display:flex; align-items:center; gap:10px; padding:7px 10px; background:var(--bg2); border-radius:6px; margin-bottom:5px; }
        .event-time { font-family:'Orbitron',sans-serif; font-size:9px; color:var(--text-dim); min-width:35px; }
        .event-icon { font-size:14px; }
        .event-desc { font-size:11px; color:var(--text); flex:1; }
        .event-aka-border { border-left:2px solid var(--primary); }
        .event-ao-border  { border-left:2px solid var(--blue); }
        .section-title { font-family:'Orbitron',sans-serif; font-size:10px; color:var(--primary); letter-spacing:2px; margin-bottom:10px; }
        .setup-fighters { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; margin:8px 0; }
        .vs-sep { display:flex; align-items:center; justify-content:center; padding-top:22px; color:var(--text-dim); font-family:'Orbitron',sans-serif; font-size:11px; }
        .live-badge { background:var(--primary); color:#fff; padding:3px 8px; border-radius:4px; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:700; animation:blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.4;} }
        .tabs { display:flex; gap:8px; margin-bottom:16px; }
        .tab-btn { padding:7px 16px; border-radius:6px; background:var(--bg2); border:1px solid var(--border); color:var(--text-dim); font-family:'Orbitron',sans-serif; font-size:9px; cursor:pointer; font-weight:700; }
        .tab-btn.active { background:var(--primary-glow); border-color:var(--primary); color:var(--primary); }
        .notif { position:fixed; bottom:20px; right:20px; background:var(--bg2); border:1px solid var(--primary); color:var(--text); padding:12px 20px; border-radius:8px; font-family:'Orbitron',sans-serif; font-size:11px; display:none; z-index:1000; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:var(--bg2); }
        ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:2px; }
    </style>
</head>
<body>
<div class="admin-lock">
    <span style="color:var(--primary);">[ SÉCURITÉ ADMIN ]</span>
    <input type="email" id="admin-email" placeholder="Email Command">
    <input type="password" id="admin-password" placeholder="Clé d'accès">
    <button onclick="loginAdmin()">DÉVERROUILLER LE SYSTÈME</button>
    <span id="auth-msg" style="color:#666;">SYSTÈME VERROUILLÉ</span>
</div>
<div class="header">
    <div class="logo-area">
        <div class="sport-badge">🥋 KAR</div>
        <h1>FECAAPP — KARATÉ ELITE COMMAND v5.2</h1>
    </div>
    <div id="status-io">📡 SIGNAL LIVE DÉCONNECTÉ</div>
</div>
<div class="main-layout">
    <div class="side-panel">
        <div class="panel-card red-border">
            <h3><span>📡</span><span style="color:var(--primary);">PILOTAGE DIRECT</span></h3>
            <label>Combat à piloter</label>
            <select id="matchSelector"><option value="">Chargement...</option></select>
            <button class="btn btn-red" onclick="lancerRegie()">LANCER LA RÉGIE</button>
        </div>
        <div class="panel-card gold-border">
            <h3><span>🥋</span><span style="color:var(--gold);">SCORE EN DIRECT</span></h3>
            <label>AKA (Rouge) 🔴</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">
                <button class="action-btn action-aka" onclick="addScore('aka','yuko')">YUKO +1</button>
                <button class="action-btn action-aka" onclick="addScore('aka','wazaari')">WAZA-ARI +2</button>
                <button class="action-btn action-aka" onclick="addScore('aka','ippon')">IPPON 🏆</button>
                <button class="action-btn action-aka" onclick="addPenalty('aka')" style="font-size:8px;">PÉNALITÉ AKA</button>
            </div>
            <label style="margin-top:12px;">AO (Bleu) 🔵</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">
                <button class="action-btn action-ao" onclick="addScore('ao','yuko')">YUKO +1</button>
                <button class="action-btn action-ao" onclick="addScore('ao','wazaari')">WAZA-ARI +2</button>
                <button class="action-btn action-ao" onclick="addScore('ao','ippon')">IPPON 🏆</button>
                <button class="action-btn action-ao" onclick="addPenalty('ao')" style="font-size:8px;">PÉNALITÉ AO</button>
            </div>
            <label style="margin-top:12px;">CHRONO</label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px;">
                <button class="action-btn" style="background:rgba(0,255,133,0.1);color:var(--green);border:1px solid var(--green);" onclick="startTimer()">▶ START</button>
                <button class="action-btn" style="background:rgba(255,0,68,0.1);color:var(--primary);border:1px solid var(--primary);" onclick="stopTimer()">⏸ STOP</button>
            </div>
            <button class="btn" style="background:#1a1a1a;color:var(--text-dim);border:1px solid var(--border);margin-top:8px;font-size:9px;" onclick="undoLast()">↩ ANNULER DERNIER</button>
        </div>
        <div class="panel-card green-border">
            <h3><span>📅</span><span style="color:var(--green);">PROGRAMMER UN COMBAT</span></h3>
            <label>Compétition / Tournoi (Nom de la ligue)</label>
            <input type="text" id="setupTournoi" placeholder="Ex: CHAMPIONNAT NATIONAL">
            <label>Lieu / Dojo</label>
            <input type="text" id="setupDojo" placeholder="Ex: Palais des Sports">
            <label>Discipline</label>
            <select id="setupDiscipline">
                <option value="kumite">KUMITE (Combat)</option>
                <option value="kata">KATA (Forme)</option>
                <option value="kumite_equipe">KUMITE PAR ÉQUIPES</option>
                <option value="kata_equipe">KATA PAR ÉQUIPES</option>
            </select>
            <label>Catégorie de poids</label>
            <select id="setupWeightClass">
                <option value="-60kg">HOMMES -60 kg</option>
                <option value="-67kg">HOMMES -67 kg</option>
                <option value="-75kg">HOMMES -75 kg</option>
                <option value="-84kg">HOMMES -84 kg</option>
                <option value="+84kg">HOMMES +84 kg</option>
                <option value="f-50kg">FEMMES -50 kg</option>
                <option value="f-55kg">FEMMES -55 kg</option>
                <option value="f-61kg">FEMMES -61 kg</option>
                <option value="f-68kg">FEMMES -68 kg</option>
                <option value="f+68kg">FEMMES +68 kg</option>
            </select>
            <label>Tour</label>
            <select id="setupTour">
                <option value="poule">TOUR DE POULE</option>
                <option value="8">HUITIÈMES</option>
                <option value="4">QUARTS DE FINALE</option>
                <option value="demi">DEMI-FINALES</option>
                <option value="bronze">COMBAT POUR LA 3E PLACE</option>
                <option value="finale">FINALE</option>
            </select>
            <label>Genre</label>
            <select id="setupGender">
                <option value="Masculin">MASCULIN</option>
                <option value="Féminin">FÉMININ</option>
            </select>
            <label>Date &amp; Heure</label>
            <input type="datetime-local" id="setupTime">
            <div style="margin-top:10px;padding:10px;background:#1a1a1a;border-radius:6px;border-left:3px solid var(--primary);">
                <div style="font-size:9px;color:var(--primary);font-family:'Orbitron',sans-serif;margin-bottom:6px;">🔴 AKA (ROUGE)</div>
                <input type="text" id="setupAka" placeholder="Nom Combattant AKA" style="margin-bottom:5px;">
                <input type="text" id="setupAkaCountry" placeholder="Pays (CMR)">
                <input type="text" id="setupAkaClub" placeholder="Club / Dojo">
                <input type="text" id="setupAkaPhoto" placeholder="URL Photo combattant">
            </div>
            <div style="margin-top:8px;padding:10px;background:#1a1a1a;border-radius:6px;border-left:3px solid var(--blue);">
                <div style="font-size:9px;color:var(--blue);font-family:'Orbitron',sans-serif;margin-bottom:6px;">🔵 AO (BLEU)</div>
                <input type="text" id="setupAo" placeholder="Nom Combattant AO" style="margin-bottom:5px;">
                <input type="text" id="setupAoCountry" placeholder="Pays (CMR)">
                <input type="text" id="setupAoClub" placeholder="Club / Dojo">
                <input type="text" id="setupAoPhoto" placeholder="URL Photo combattant">
            </div>
            <button class="btn btn-green" onclick="createMatch()">ENREGISTRER EN BASE</button>
        </div>
        <div class="panel-card" style="border-color:rgba(255,0,68,0.3)">
            <h3><span>🏆</span><span style="color:var(--primary);">CLASSEMENT</span></h3>
            <label>Compétition</label>
            <input type="text" id="rankTournoi" placeholder="Ex: CHAMPIONNAT NATIONAL">
            <label>Nom du Combattant</label>
            <input type="text" id="rankFighter" placeholder="Nom Combattant">
            <label>Médaille</label>
            <select id="rankMedal">
                <option value="gold">🥇 OR</option>
                <option value="silver">🥈 ARGENT</option>
                <option value="bronze">🥉 BRONZE</option>
            </select>
            <button class="btn btn-red" onclick="addRanking()">AJOUTER AU CLASSEMENT</button>
        </div>
    </div>
    <div class="regie-area" id="regieContainer">
        <div class="regie-empty">
            <div class="icon-big">🥋</div>
            <p>SÉLECTIONNEZ UN COMBAT</p>
            <p style="font-size:9px;opacity:0.5;margin-top:5px;">ET LANCEZ LA RÉGIE POUR PILOTER EN DIRECT</p>
        </div>
    </div>
</div>
<div class="notif" id="notif"></div>
</body>
</html>
