<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FECAAPP - VOLLEYBALL ELITE COMMAND v5.2 PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="script.js" defer></script>
    <style>
        :root {
            --primary: #9B59FF; --primary-glow: rgba(155,89,255,0.12);
            --secondary: #00D1FF;
            --bg: #050505; --bg2: #0D0D0D; --bg3: #111111;
            --border: rgba(255,255,255,0.07);
            --text: #FFFFFF; --text-dim: rgba(255,255,255,0.4);
            --green: #00FF85; --red: #FF3B3B; --gold: #FFD700;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; min-height:100vh; }
        .admin-lock { background:#000; border-bottom:2px solid var(--primary); padding:10px 20px; display:flex; justify-content:center; align-items:center; gap:15px; font-family:'Orbitron',sans-serif; font-size:11px; flex-wrap:wrap; }
        .admin-lock input { background:#111; border:1px solid #333; color:var(--primary); padding:5px 10px; border-radius:4px; outline:none; }
        .admin-lock button { background:var(--primary); color:#fff; border:none; padding:5px 15px; border-radius:4px; font-weight:bold; cursor:pointer; text-transform:uppercase; font-family:'Orbitron',sans-serif; }
        .header { background:linear-gradient(135deg,#0a0a0a,#0d0d0d); border-bottom:1px solid var(--border); padding:15px 30px; display:flex; justify-content:space-between; align-items:center; }
        .logo-area { display:flex; align-items:center; gap:15px; }
        .sport-badge { background:var(--primary); color:#fff; padding:4px 10px; border-radius:4px; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; }
        .header h1 { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:900; color:var(--primary); letter-spacing:2px; }
        #status-io { font-family:'Orbitron',sans-serif; font-size:10px; color:var(--text-dim); }
        .main-layout { display:flex; min-height:calc(100vh - 100px); }
        .side-panel { width:300px; min-width:300px; background:var(--bg2); border-right:1px solid var(--border); padding:20px; display:flex; flex-direction:column; gap:15px; overflow-y:auto; }
        .panel-card { background:var(--bg3); border-radius:10px; padding:15px; border:1px solid var(--border); }
        .panel-card h3 { font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; margin-bottom:12px; letter-spacing:1px; display:flex; align-items:center; gap:8px; }
        .panel-card label { display:block; font-size:10px; color:var(--text-dim); margin-bottom:4px; margin-top:8px; text-transform:uppercase; letter-spacing:1px; }
        .panel-card input, .panel-card select { width:100%; background:#1a1a1a; border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-family:'Rajdhani',sans-serif; font-size:12px; outline:none; }
        .btn { width:100%; padding:9px; border-radius:6px; border:none; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:700; letter-spacing:1px; margin-top:12px; transition:opacity 0.15s; }
        .btn:hover { opacity:0.85; }
        .btn-purple { background:var(--primary); color:#fff; }
        .btn-cyan   { background:var(--secondary); color:#000; }
        .btn-green  { background:var(--green); color:#000; }
        .btn-red    { background:var(--red); color:#fff; }
        .purple-border { border-color:var(--primary) !important; }
        .cyan-border   { border-color:var(--secondary) !important; }
        .green-border  { border-color:var(--green) !important; }
        .regie-area { flex:1; padding:25px; overflow-y:auto; background:var(--bg); }
        .regie-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:15px; color:var(--text-dim); }
        .regie-empty .icon-big { font-size:60px; opacity:0.3; }
        .regie-empty p { font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px; }
        .vb-scoreboard { background:var(--bg2); border:1px solid var(--border); border-radius:14px; overflow:hidden; margin-bottom:20px; }
        .vb-score-header { background:linear-gradient(135deg,rgba(155,89,255,0.1),transparent); padding:15px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); }
        .vb-match-title { font-family:'Orbitron',sans-serif; font-size:12px; color:var(--primary); font-weight:900; }
        .live-badge { background:var(--red); color:#fff; padding:3px 8px; border-radius:4px; font-family:'Orbitron',sans-serif; font-size:9px; font-weight:700; animation:blink 1s infinite; }
        @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.4;} }
        .vb-court-row { display:grid; grid-template-columns:1fr 120px 1fr; align-items:center; padding:20px; }
        .vb-team-side { text-align:center; }
        .vb-team-logo { width:60px; height:60px; border-radius:50%; background:rgba(155,89,255,0.1); border:2px solid var(--primary); margin:0 auto 10px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .vb-team-logo img { width:100%; height:100%; object-fit:cover; }
        .vb-team-name { font-size:14px; font-weight:700; color:var(--text); }
        .vb-team-score { font-family:'Orbitron',sans-serif; font-size:52px; font-weight:900; }
        .vb-score-p1 { color:var(--primary); }
        .vb-score-p2 { color:var(--secondary); }
        .vb-center-info { text-align:center; }
        .vb-sets-row { display:flex; gap:6px; justify-content:center; margin-bottom:10px; }
        .vb-set-chip { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:900; border:1px solid var(--border); color:var(--text-dim); flex-direction:column; line-height:1.1; }
        .vb-set-chip.won-p1 { background:rgba(155,89,255,0.2); border-color:var(--primary); color:var(--primary); }
        .vb-set-chip.won-p2 { background:rgba(0,209,255,0.2); border-color:var(--secondary); color:var(--secondary); }
        .vb-set-chip.current { background:rgba(255,215,0,0.1); border-color:var(--gold); color:var(--gold); }
        .vb-service-indicator { margin-top:6px; font-size:10px; color:var(--text-dim); }
        .service-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--primary); margin-right:4px; }
        .vb-actions-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:15px 20px; border-top:1px solid var(--border); }
        .vb-point-btn { padding:12px; border-radius:8px; border:none; cursor:pointer; font-family:'Orbitron',sans-serif; font-size:11px; font-weight:700; transition:all 0.2s; }
        .vb-btn-p1 { background:rgba(155,89,255,0.1); color:var(--primary); border:1px solid var(--primary); }
        .vb-btn-p1:hover { background:var(--primary); color:#fff; }
        .vb-btn-p2 { background:rgba(0,209,255,0.1); color:var(--secondary); border:1px solid var(--secondary); }
        .vb-btn-p2:hover { background:var(--secondary); color:#000; }
        .sets-table { width:100%; border-collapse:collapse; margin-bottom:20px; }
        .sets-table th { font-family:'Orbitron',sans-serif; font-size:9px; color:var(--text-dim); padding:8px 12px; text-align:center; border-bottom:1px solid var(--border); }
        .sets-table th:first-child { text-align:left; }
        .sets-table td { padding:10px 12px; font-size:12px; font-weight:600; text-align:center; border-bottom:1px solid rgba(255,255,255,0.03); }
        .sets-table td:first-child { text-align:left; font-size:13px; font-weight:700; }
        .vb-stat-row { margin-bottom:16px; }
        .vb-stat-header { display:flex; justify-content:space-between; margin-bottom:6px; }
        .vb-stat-val { font-family:'Orbitron',sans-serif; font-size:13px; font-weight:900; }
        .vb-stat-lbl { font-size:9px; color:var(--text-dim); text-align:center; text-transform:uppercase; letter-spacing:1px; }
        .vb-bar { height:4px; background:var(--bg3); border-radius:2px; overflow:hidden; position:relative; }
        .vb-bar-left  { position:absolute; left:0;  height:100%; background:var(--primary); border-radius:2px; }
        .vb-bar-right { position:absolute; right:0; height:100%; background:var(--secondary); border-radius:2px; }
        .lineup-grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
        .lineup-team { }
        .lineup-title { font-size:11px; font-weight:700; margin-bottom:10px; }
        .player-row-vb { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--bg3); border-radius:6px; margin-bottom:5px; }
        .player-num { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Orbitron',sans-serif; font-size:10px; font-weight:900; flex-shrink:0; }
        .player-num-p1 { background:rgba(155,89,255,0.2); border:1px solid var(--primary); color:var(--primary); }
        .player-num-p2 { background:rgba(0,209,255,0.2); border:1px solid var(--secondary); color:var(--secondary); }
        .player-name-vb { font-size:12px; font-weight:600; color:var(--text); flex:1; }
        .player-pos { font-size:9px; color:var(--text-dim); font-weight:700; text-transform:uppercase; }
        .libero-badge { font-size:8px; background:rgba(255,215,0,0.15); color:var(--gold); border:1px solid var(--gold); padding:1px 5px; border-radius:3px; font-family:'Orbitron',sans-serif; }
        .capitaine-badge { font-size:8px; color:var(--text-dim); }
        .setup-teams { display:grid; grid-template-columns:1fr auto 1fr; gap:8px; align-items:start; margin:8px 0; }
        .vs-sep { display:flex; align-items:center; justify-content:center; padding-top:20px; color:var(--text-dim); font-family:'Orbitron',sans-serif; font-size:11px; }
        .stats-section-title { font-family:'Orbitron',sans-serif; font-size:10px; color:var(--primary); letter-spacing:2px; margin-bottom:12px; margin-top:20px; }
        .tabs { display:flex; gap:8px; margin-bottom:20px; }
        .tab-btn { padding:7px 16px; border-radius:6px; background:var(--bg2); border:1px solid var(--border); color:var(--text-dim); font-family:'Orbitron',sans-serif; font-size:9px; cursor:pointer; font-weight:700; }
        .tab-btn.active { background:var(--primary-glow); border-color:var(--primary); color:var(--primary); }
        .notif { position:fixed; bottom:20px; right:20px; background:var(--bg2); border:1px solid var(--primary); color:var(--text); padding:12px 20px; border-radius:8px; font-family:'Orbitron',sans-serif; font-size:11px; display:none; z-index:1000; }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:var(--bg2); }
        ::-webkit-scrollbar-thumb { background:var(--primary); border-radius:2px; }
    </style>
</head>
<body>
<div class="admin-lock">
    <span style="color:var(--primary);">[ SÉCURITÉ ADMIN ]</span>
    <input type="email" id="admin-email" placeholder="Email Command">
    <input type="password" id="admin-password" placeholder="Clé d'accès">
    <button onclick="loginAdmin()">DÉVERROUILLER LE SYSTÈME</button>
    <span id="auth-msg" style="color:#666;">SYSTÈME VERROUILLÉ</span>
</div>
<div class="header">
    <div class="logo-area">
        <div class="sport-badge">🏐 VOL</div>
        <h1>FECAAPP — VOLLEYBALL ELITE COMMAND v5.2</h1>
    </div>
    <div id="status-io">📡 SIGNAL LIVE DÉCONNECTÉ</div>
</div>
<div class="main-layout">
    <div class="side-panel">
        <div class="panel-card purple-border">
            <h3><span>📡</span> <span style="color:var(--primary);">PILOTAGE DIRECT</span></h3>
            <label>Match à piloter</label>
            <select id="matchSelector"><option value="">Chargement...</option></select>
            <button class="btn btn-purple" onclick="lancerRegie()">LANCER LA RÉGIE</button>
        </div>
        <div class="panel-card cyan-border">
            <h3><span>🏐</span> <span style="color:var(--secondary);">SCORE EN DIRECT</span></h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px;">
                <button class="vb-point-btn vb-btn-p1" onclick="addPoint('p1')">POINT<br><small id="scoreLabel1" style="font-size:9px;opacity:0.8;">ÉQUIPE 1</small></button>
                <button class="vb-point-btn vb-btn-p2" onclick="addPoint('p2')">POINT<br><small id="scoreLabel2" style="font-size:9px;opacity:0.8;">ÉQUIPE 2</small></button>
            </div>
            <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;">
                <button class="vb-point-btn vb-btn-p1" onclick="addAce('p1')"   style="padding:7px;font-size:9px;">ACE ÉQ.1 🚀</button>
                <button class="vb-point-btn vb-btn-p2" onclick="addAce('p2')"   style="padding:7px;font-size:9px;">ACE ÉQ.2 🚀</button>
                <button class="vb-point-btn vb-btn-p1" onclick="addBlock('p1')" style="padding:7px;font-size:9px;">BLOCK ÉQ.1 🛡️</button>
                <button class="vb-point-btn vb-btn-p2" onclick="addBlock('p2')" style="padding:7px;font-size:9px;">BLOCK ÉQ.2 🛡️</button>
            </div>
            <button class="btn btn-red" style="font-size:9px;margin-top:8px;" onclick="requestTimeout('p1')">⏱ TEMPS MORT ÉQ.1</button>
            <button class="btn btn-red" style="font-size:9px;margin-top:6px;" onclick="requestTimeout('p2')">⏱ TEMPS MORT ÉQ.2</button>
            <button class="btn" style="background:#222;color:var(--text-dim);font-size:9px;margin-top:6px;border:1px solid var(--border);" onclick="undoPoint()">↩ ANNULER POINT</button>
        </div>
        <div class="panel-card green-border">
            <h3><span>📅</span> <span style="color:var(--green);">PROGRAMMER UN MATCH</span></h3>
            <label>Compétition / Ligue (Nom de la ligue)</label>
            <input type="text" id="setupLeague" placeholder="Ex: ÉLITE VOLLEY">
            <label>URL Logo Compétition</label>
            <input type="text" id="setupLeagueLogo" placeholder="https://...">
            <label>Journée</label>
            <input type="text" id="setupJournee" placeholder="Ex: J8">
            <label>Salle / Gymnase</label>
            <input type="text" id="setupStadium" placeholder="Gymnase Omnisports">
            <label>Date &amp; Heure</label>
            <input type="datetime-local" id="setupTime">
            <label>Genre</label>
            <select id="setupGender">
                <option value="Masculin">MASCULIN</option>
                <option value="Féminin">FÉMININ</option>
                <option value="Mixte">BEACH VOLLEY MIXTE</option>
            </select>
            <label>Type</label>
            <select id="setupType">
                <option value="indoor">INDOOR (6x6)</option>
                <option value="beach">BEACH VOLLEY (2x2)</option>
            </select>
            <div class="setup-teams">
                <div>
                    <label>Équipe A</label>
                    <input type="text" id="setupA" placeholder="Nom Équipe A">
                    <label>Logo A</label>
                    <input type="text" id="logoA" placeholder="URL Logo A">
                </div>
                <div class="vs-sep">VS</div>
                <div>
                    <label>Équipe B</label>
                    <input type="text" id="setupB" placeholder="Nom Équipe B">
                    <label>Logo B</label>
                    <input type="text" id="logoB" placeholder="URL Logo B">
                </div>
            </div>
            <button class="btn btn-green" onclick="createMatch()">ENREGISTRER EN BASE</button>
        </div>
        <div class="panel-card" style="border-color:rgba(155,89,255,0.3)">
            <h3><span>🏆</span> <span style="color:var(--primary);">CLASSEMENT</span></h3>
            <label>Ligue cible</label>
            <select id="standingsLeagueSelector"><option value="">Chargement...</option></select>
            <label>Nom du Club</label>
            <input type="text" id="rankTeam" placeholder="Nom du Club">
            <label>URL Logo</label>
            <input type="text" id="rankLogo" placeholder="https://...">
            <button class="btn btn-purple" onclick="addToStandings()">AJOUTER AU CLASSEMENT</button>
        </div>
    </div>
    <div class="regie-area" id="regieContainer">
        <div class="regie-empty">
            <div class="icon-big">🏐</div>
            <p>SÉLECTIONNEZ UN MATCH</p>
            <p style="font-size:9px;opacity:0.5;margin-top:5px;">ET LANCEZ LA RÉGIE POUR PILOTER EN DIRECT</p>
        </div>
    </div>
</div>
<div class="notif" id="notif"></div>
</body>
</html>
